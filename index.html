<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>دستیار رومیزی</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: sans-serif; background:#0f1115; color:#fff; text-align:center;
         padding:20px; margin:0; min-height:100vh; }
  h2 { font-weight:600; font-size:22px; margin:0 0 4px; }
  .status { font-size:13px; color:#8b93a3; margin-bottom:24px; }
  .section-title { font-size:13px; color:#8b93a3; margin:24px 0 12px; text-align:right; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .grid3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; }
  button { padding:18px 8px; font-size:15px; border:none; border-radius:14px;
           background:#1c2733; color:#fff; box-shadow:0 2px 6px rgba(0,0,0,0.3); }
  button:active { background:#2196F3; transform:scale(0.97); }
  .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
           background:#2196F3; color:#fff; padding:10px 20px; border-radius:20px;
           font-size:13px; opacity:0; transition:opacity 0.3s; pointer-events:none; }
  .toast.show { opacity:1; }
  #lockScreen { position:fixed; inset:0; background:#0f1115; display:flex;
                flex-direction:column; align-items:center; justify-content:center;
                gap:14px; z-index:100; padding:20px; }
  #lockScreen input { padding:14px; font-size:16px; border-radius:12px; border:none;
                       width:220px; text-align:center; }
  #lockScreen button { padding:14px 20px; font-size:15px; border:none; border-radius:12px;
                        background:#2196F3; color:#fff; width:220px; }
  #lockError { color:#ff6b6b; font-size:13px; min-height:18px; }
  #appContent { display:none; }

  #chatBox { text-align:right; background:#1c2733; border-radius:14px; padding:12px;
             min-height:120px; max-height:260px; overflow-y:auto; margin-bottom:10px; }
  .msg { padding:8px 12px; border-radius:10px; margin:6px 0; font-size:14px; line-height:1.5; }
  .msg.user { background:#2196F3; margin-left:30px; }
  .msg.ai { background:#2a3542; margin-right:30px; }
  .chatRow { display:flex; gap:8px; }
  #chatInput { flex:1; padding:14px; font-size:15px; border-radius:12px; border:none;
               background:#1c2733; color:#fff; }
  #micBtn, #sendBtn { padding:14px 16px; border-radius:12px; border:none; background:#2196F3; color:#fff; }
  #micBtn.listening { background:#ff6b6b; }

  #secretBox { display:none; margin:16px 0; gap:8px; }
  #secretBox input { flex:1; padding:12px; font-size:14px; border-radius:10px; border:none;
                      background:#1c2733; color:#fff; text-align:center; }
  #secretBox button { padding:12px 16px; background:#2196F3; }
  .partyOn button.active { background:#ff9800; }

  #quizBox { display:none; text-align:right; background:#1c2733; border-radius:14px;
             padding:14px; margin-top:10px; }
  #quizProgress { font-size:12px; color:#8b93a3; margin-bottom:8px; }
  #quizQuestion { font-size:15px; margin-bottom:10px; line-height:1.6; }
  #quizOptions { display:flex; flex-direction:column; gap:8px; }
  #quizOptions button { text-align:right; width:100%; }
  #leaderboardBox { display:none; text-align:right; background:#1c2733; border-radius:14px;
                     padding:14px; margin-top:10px; font-size:14px; }
  .lbRow { padding:6px 0; border-bottom:1px solid #2a3542; }

  .miniBox { background:#1c2733; border-radius:14px; padding:12px; margin-top:10px;
             text-align:right; font-size:14px; line-height:1.6; }
  .miniForm { display:flex; flex-direction:column; gap:8px; margin-top:8px; }
  .miniForm input { padding:10px; font-size:14px; border-radius:10px; border:none;
                     background:#0f1115; color:#fff; text-align:right; }
  .miniForm button { background:#2196F3; }
</style>
</head>
<body>

<div id="lockScreen">
  <h2>دستیار رومیزی</h2>
  <input type="password" id="passInput" placeholder="رمز عبور" autofocus>
  <button onclick="checkPass()">ورود</button>
  <div id="lockError"></div>
</div>

<div id="appContent">
<h2 id="titleTap" onclick="titleTap()">دستیار رومیزی</h2>
<div class="status">کنترل از هرجا</div>

<div id="secretBox" class="chatRow">
  <input type="text" id="secretInput" placeholder="رمز مخفی رو وارد کن">
  <button onclick="checkSecret()">تایید</button>
</div>

<div class="grid">
<button onclick="btn(1)">دما</button>
<button onclick="btn(2)">ساعت</button>
<button onclick="btn(3)">آب‌وهوا</button>
<button onclick="btn(4)">تاریخ شمسی</button>
<button onclick="btn(5)">تعطیلی امروز</button>
<button onclick="btn(6)">تعطیلی فردا</button>
<button onclick="btn(7)">جمله ۱</button>
<button onclick="btn(8)">جمله ۲</button>
</div>

<div class="section-title">موزیک</div>
<div class="grid">
<button onclick="btn(9)">پخش / توقف</button>
<button onclick="btn(10)">توقف کامل</button>
<button onclick="btn(11)">آهنگ بعدی</button>
<button onclick="btn(12)">آهنگ قبلی</button>
</div>

<div class="section-title">صدا</div>
<div class="grid3">
<button onclick="btn(13)">صدا زیاد</button>
<button onclick="btn(14)">صدا کم</button>
<button onclick="btn(15)">قطع صدا</button>
</div>

<div class="section-title">قابلیت‌های ویژه</div>
<div class="grid">
<button onclick="btn(16)">آمار من</button>
<button onclick="btn(17)">فال حافظ</button>
</div>
<div class="grid" id="partyGrid">
<button id="partyOnBtn" onclick="setParty(true)">حالت مهمونی روشن</button>
<button id="partyOffBtn" onclick="setParty(false)">حالت مهمونی خاموش</button>
</div>

<div class="section-title">مسابقه و امتیازات</div>
<div class="grid">
<button onclick="startQuiz()">🎮 شروع مسابقه</button>
<button onclick="showLeaderboard()">🏆 جدول امتیازات</button>
</div>
<div id="quizBox">
  <div id="quizProgress"></div>
  <div id="quizQuestion"></div>
  <div id="quizOptions"></div>
</div>
<div id="leaderboardBox"></div>

<div class="section-title">زمان و یادآوری</div>
<div class="miniBox" id="nowruzBox"></div>
<div class="miniBox" id="fortuneBox"></div>

<div class="miniBox">
  شمارش معکوس شخصی
  <div class="miniForm">
    <input type="text" id="pcLabel" placeholder="اسم مناسبت (مثلاً امتحان ریاضی)">
    <input type="date" id="pcDate">
    <button onclick="savePersonalCountdown()">ذخیره</button>
  </div>
  <div id="pcResult" style="margin-top:8px;"></div>
</div>

<div class="miniBox">
  تایمر / یادآور
  <div class="miniForm">
    <input type="number" id="timerMinutes" placeholder="چند دقیقه دیگه؟">
    <input type="text" id="timerLabel" placeholder="یادآوری چی؟">
    <button onclick="startTimer()">شروع تایمر</button>
  </div>
  <div id="timerStatus" style="margin-top:8px;"></div>
</div>

<div class="miniBox">
  پیام به آینده
  <div class="miniForm">
    <input type="text" id="fmText" placeholder="پیامت چیه؟">
    <input type="date" id="fmDate">
    <button onclick="saveFutureMsg()">ذخیره‌ی پیام</button>
  </div>
  <div id="fmStatus" style="margin-top:8px;"></div>
</div>

<div class="section-title">دستیار هوشمند</div>
<div id="chatBox"></div>
<div class="chatRow">
  <button id="micBtn" onclick="toggleMic()">🎤</button>
  <input type="text" id="chatInput" placeholder="پیامت رو بنویس یا میکروفون بزن...">
  <button id="sendBtn" onclick="sendChat()">ارسال</button>
</div>

<div id="toast" class="toast">ارسال شد</div>
</div>

<script>
const PROXY_URL = "https://desk-assistant-proxy.kdkdke126.workers.dev";
const AI_URL = "https://desk-assistant-ai.kdkdke126.workers.dev";
const SITE_PASSWORD = "Mm17881788@";

function checkPass() {
  const val = document.getElementById("passInput").value;
  if (val === SITE_PASSWORD) {
    localStorage.setItem("deskAssistantUnlocked", "1");
    document.getElementById("lockScreen").style.display = "none";
    document.getElementById("appContent").style.display = "block";
  } else {
    document.getElementById("lockError").innerText = "رمز اشتباهه";
  }
}

document.getElementById("passInput").addEventListener("keydown", function(e) {
  if (e.key === "Enter") checkPass();
});

if (localStorage.getItem("deskAssistantUnlocked") === "1") {
  document.getElementById("lockScreen").style.display = "none";
  document.getElementById("appContent").style.display = "block";
}

function btn(id) {
  fetch(PROXY_URL + "/?id=" + id)
    .then(r => r.text()).then(t => { document.getElementById("toast").innerText = t; showToast(); });
}

function showToast() {
  const t = document.getElementById("toast");
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 1200);
}

// --- حالت مهمونی ---
function setParty(on) {
  btn(on ? 23 : 24);
  document.getElementById("partyOnBtn").classList.toggle("active", on);
  document.getElementById("partyOffBtn").classList.toggle("active", !on);
}

// --- رمز مخفی (روی عنوان بالای صفحه ۵ بار ضربه بزن تا ظاهر بشه) ---
const SECRET_CODES = {
  "konami": 30,
  "mohandes": 31
};
let tapCount = 0;
let tapTimer = null;

function titleTap() {
  tapCount++;
  clearTimeout(tapTimer);
  tapTimer = setTimeout(() => { tapCount = 0; }, 1500);
  if (tapCount >= 5) {
    tapCount = 0;
    const box = document.getElementById("secretBox");
    box.style.display = "flex";
    document.getElementById("secretInput").focus();
  }
}

function checkSecret() {
  const val = document.getElementById("secretInput").value.trim().toLowerCase();
  const id = SECRET_CODES[val] || 32;
  btn(id);
  document.getElementById("secretInput").value = "";
  document.getElementById("secretBox").style.display = "none";
}

document.getElementById("secretInput").addEventListener("keydown", function(e) {
  if (e.key === "Enter") checkSecret();
});

// --- مسابقه‌ی فیلم/بازی (OpenTDB) + جدول امتیازات (Adafruit IO از طریق Worker) ---
const LB_URL = "https://leaderboard-proxy.kdkdke126.workers.dev";
let quizQuestions = [];
let quizIndex = 0;
let quizScore = 0;

function decodeHTML(html) {
  const txt = document.createElement("textarea");
  txt.innerHTML = html;
  return txt.value;
}

async function startQuiz() {
  document.getElementById("leaderboardBox").style.display = "none";
  const box = document.getElementById("quizBox");
  box.style.display = "block";
  document.getElementById("quizProgress").innerText = "";
  document.getElementById("quizQuestion").innerText = "در حال دریافت سوال...";
  document.getElementById("quizOptions").innerHTML = "";

  const cat = Math.random() < 0.5 ? 11 : 15; // ۱۱=فیلم، ۱۵=بازی ویدیویی
  try {
    const resp = await fetch(`https://opentdb.com/api.php?amount=5&category=${cat}&type=multiple`);
    const data = await resp.json();
    if (!data.results || !data.results.length) throw new Error("no questions");
    quizQuestions = data.results;
    quizIndex = 0;
    quizScore = 0;
    showQuizQuestion();
  } catch (e) {
    document.getElementById("quizQuestion").innerText = "اتصال به سوال‌ها برقرار نشد، دوباره امتحان کن";
  }
}

function showQuizQuestion() {
  if (quizIndex >= quizQuestions.length) {
    finishQuiz();
    return;
  }
  const q = quizQuestions[quizIndex];
  document.getElementById("quizProgress").innerText =
    `سوال ${quizIndex + 1} از ${quizQuestions.length} — امتیاز: ${quizScore}`;
  document.getElementById("quizQuestion").innerText = decodeHTML(q.question);

  const correct = decodeHTML(q.correct_answer);
  const options = [...q.incorrect_answers.map(decodeHTML), correct];
  options.sort(() => Math.random() - 0.5);

  const optBox = document.getElementById("quizOptions");
  optBox.innerHTML = "";
  options.forEach(opt => {
    const b = document.createElement("button");
    b.innerText = opt;
    b.onclick = () => answerQuiz(opt, correct);
    optBox.appendChild(b);
  });
}

function answerQuiz(picked, correct) {
  if (picked === correct) { quizScore++; btn(25); } else { btn(26); }
  quizIndex++;
  setTimeout(showQuizQuestion, 700);
}

async function finishQuiz() {
  document.getElementById("quizQuestion").innerText =
    `تموم شد! امتیازت: ${quizScore} از ${quizQuestions.length}`;
  document.getElementById("quizOptions").innerHTML = "";
  document.getElementById("quizProgress").innerText = "";

  const name = prompt("اسمت رو برای جدول امتیازات بنویس:");
  if (name && name.trim()) {
    try {
      await fetch(LB_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ feed: "leaderboard", value: name.trim() + "|" + quizScore })
      });
    } catch (e) {}
  }
}

async function showLeaderboard() {
  document.getElementById("quizBox").style.display = "none";
  const box = document.getElementById("leaderboardBox");
  box.style.display = "block";
  box.innerHTML = "در حال بارگذاری...";
  try {
    const resp = await fetch(`${LB_URL}?feed=leaderboard&limit=50`);
    const data = await resp.json();
    const rows = data.map(d => {
      const parts = (d.value || "").split("|");
      return { name: parts[0] || "؟", score: parseInt(parts[1]) || 0 };
    });
    rows.sort((a, b) => b.score - a.score);
    const top = rows.slice(0, 10);
    box.innerHTML = top.length
      ? top.map((r, i) => `<div class="lbRow">${i + 1}. ${r.name} — ${r.score} امتیاز</div>`).join("")
      : "هنوز امتیازی ثبت نشده";
  } catch (e) {
    box.innerHTML = "خطا در دریافت جدول امتیازات";
  }
}

// --- شمارش معکوس تا نوروز (تقریبی، ۲۱ اسفند/۲۱ مارس) ---
function nowruzCountdown() {
  const now = new Date();
  let year = now.getFullYear();
  let target = new Date(year, 2, 21, 0, 0, 0);
  if (now >= target) target = new Date(year + 1, 2, 21, 0, 0, 0);
  const days = Math.ceil((target - now) / (1000 * 60 * 60 * 24));
  document.getElementById("nowruzBox").innerText = `🌱 ${days} روز تا نوروز مونده`;
}

// --- فال روزانه (یه جمله‌ی ثابت برای هر روز) ---
const FORTUNES = [
  "امروز روز خوبیه برای شروع یه کار جدید.",
  "یه نفس عمیق بکش، همه‌چی درست می‌شه.",
  "امروز حواست به خودت هم باشه، نه فقط کارها.",
  "یه قدم کوچیک هم جلو رفتنه.",
  "امروز به یکی که دوستش داری پیام بده.",
  "استراحت کردن هم بخشی از پیشرفته.",
  "امروز یه چیز جدید یاد بگیر، هرچقدر کوچیک.",
  "به خودت سخت نگیر، داری خوب پیش می‌ری.",
  "امروز یکی از کارهای عقب‌افتاده رو تموم کن.",
  "یادت باشه آب بخوری امروز 😄",
  "امروز یه لبخند به یکی هدیه بده.",
  "کارهای بزرگ از کارهای کوچیک شروع می‌شن.",
  "امروز رو با انرژی مثبت شروع کن.",
  "یه‌کم به آینده‌ت فکر کن، ولی امروز رو زندگی کن.",
  "امروز حتماً یه استراحت کوتاه بین کارها بذار."
];
function dailyFortune() {
  const todayKey = new Date().toISOString().slice(0, 10);
  let idx = 0;
  for (let i = 0; i < todayKey.length; i++) idx += todayKey.charCodeAt(i);
  idx = idx % FORTUNES.length;
  document.getElementById("fortuneBox").innerText = "🔮 فال امروز: " + FORTUNES[idx];
}

// --- شمارش معکوس شخصی ---
function savePersonalCountdown() {
  const label = document.getElementById("pcLabel").value.trim();
  const date = document.getElementById("pcDate").value;
  if (!label || !date) return;
  localStorage.setItem("personalCountdown", JSON.stringify({ label, date }));
  document.getElementById("pcLabel").value = "";
  document.getElementById("pcDate").value = "";
  renderPersonalCountdown();
}
function renderPersonalCountdown() {
  const raw = localStorage.getItem("personalCountdown");
  const box = document.getElementById("pcResult");
  if (!raw) { box.innerText = ""; return; }
  const { label, date } = JSON.parse(raw);
  const target = new Date(date);
  const now = new Date();
  const diffDays = Math.ceil((target - now) / (1000 * 60 * 60 * 24));
  let mood;
  if (diffDays < 0) mood = "گذشت! 😅";
  else if (diffDays === 0) mood = "همین امروزه! 😱";
  else if (diffDays <= 3) mood = "وای وای وای، خیلی نزدیکه 😰";
  else if (diffDays <= 7) mood = "داره نزدیک می‌شه‌ها 😬";
  else if (diffDays <= 30) mood = "یه‌کم وقت داری، ولی غافل نشو 🙂";
  else mood = "خیالت راحت باشه، وقت زیاده 😌";
  box.innerText = `${label}: ${diffDays} روز مونده — ${mood}`;
}

// --- تایمر / یادآور (تا وقتی این صفحه بازه) ---
let timerHandle = null;
function startTimer() {
  const mins = parseFloat(document.getElementById("timerMinutes").value);
  const label = document.getElementById("timerLabel").value.trim() || "یادآوری";
  if (!mins || mins <= 0) return;
  if (timerHandle) clearTimeout(timerHandle);
  document.getElementById("timerStatus").innerText =
    `⏳ تایمر «${label}» برای ${mins} دقیقه‌ی دیگه فعال شد (تا وقتی این صفحه بازه)`;
  timerHandle = setTimeout(() => {
    document.getElementById("timerStatus").innerText = `⏰ ${label}`;
    alert("⏰ " + label);
  }, mins * 60 * 1000);
}

// --- پیام به آینده (ذخیره روی فید Adafruit IO به اسم futuremsg) ---
async function saveFutureMsg() {
  const text = document.getElementById("fmText").value.trim();
  const date = document.getElementById("fmDate").value;
  const status = document.getElementById("fmStatus");
  if (!text || !date) return;
  status.innerText = "در حال ذخیره...";
  try {
    await fetch(LB_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ feed: "futuremsg", value: date + "|" + text })
    });
    document.getElementById("fmText").value = "";
    document.getElementById("fmDate").value = "";
    status.innerText = "ذخیره شد ✅ همون تاریخ که سایت رو باز کنی نشونت می‌دم.";
  } catch (e) {
    status.innerText = "خطا در ذخیره‌سازی";
  }
}

async function checkFutureMsg() {
  try {
    const resp = await fetch(`${LB_URL}?feed=futuremsg&limit=1`);
    const data = await resp.json();
    if (!data.length) return;
    const [dateStr, ...rest] = data[0].value.split("|");
    const text = rest.join("|");
    const target = new Date(dateStr);
    const now = new Date();
    const shownKey = "futuremsgShown_" + dateStr;
    if (now >= target && !localStorage.getItem(shownKey)) {
      localStorage.setItem(shownKey, "1");
      setTimeout(() => alert("💌 پیام از گذشته:\n\n" + text), 500);
    }
  } catch (e) {}
}

nowruzCountdown();
dailyFortune();
renderPersonalCountdown();
checkFutureMsg();

function addMsg(text, who) {
  const box = document.getElementById("chatBox");
  const div = document.createElement("div");
  div.className = "msg " + who;
  div.innerText = text;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

function sendChat() {
  const input = document.getElementById("chatInput");
  const text = input.value.trim();
  if (!text) return;
  addMsg(text, "user");
  input.value = "";
  addMsg("...", "ai");

  fetch(AI_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ text: text })
  })
  .then(r => r.json())
  .then(data => {
    const box = document.getElementById("chatBox");
    box.removeChild(box.lastChild);
    addMsg(data.answer || "جوابی نیومد", "ai");
  })
  .catch(() => {
    const box = document.getElementById("chatBox");
    box.removeChild(box.lastChild);
    addMsg("اتصال برقرار نشد", "ai");
  });
}

document.getElementById("chatInput").addEventListener("keydown", function(e) {
  if (e.key === "Enter") sendChat();
});

let recognition = null;
let listening = false;

function toggleMic() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    alert("مرورگرت از میکروفون پشتیبانی نمی‌کنه");
    return;
  }
  if (listening) {
    recognition.stop();
    return;
  }
  recognition = new SpeechRecognition();
  recognition.lang = "fa-IR";
  recognition.interimResults = false;

  recognition.onstart = function() {
    listening = true;
    document.getElementById("micBtn").classList.add("listening");
  };

  recognition.onresult = function(event) {
    const said = event.results[0][0].transcript;
    document.getElementById("chatInput").value = said;
    sendChat();
  };

  recognition.onerror = function() {
    listening = false;
    document.getElementById("micBtn").classList.remove("listening");
  };

  recognition.onend = function() {
    listening = false;
    document.getElementById("micBtn").classList.remove("listening");
  };

  recognition.start();
}
</script>
</body>
</html>
