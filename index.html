<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>دستیار رومیزی</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg1:#0b0f17; --bg2:#121a29;
    --card:#161f30; --card2:#1b263c;
    --line:#25324a;
    --text:#eef2f8; --muted:#8b96ab;
    --accent:#3b82f6; --accent-dim:#1e3a63;
    --accent2:#ff9d3d;
    --danger:#ff6b6b;
    --radius:16px;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }

  @keyframes fadeInUp{ from{ opacity:0; transform:translateY(16px);} to{ opacity:1; transform:translateY(0);} }
  @keyframes float{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-7px);} }
  @keyframes dotPulse{ 0%,100%{ box-shadow:0 0 0 0 rgba(61,220,132,.55);} 50%{ box-shadow:0 0 0 7px rgba(61,220,132,0);} }
  @keyframes bgShift{
    0%{ background-position:15% -10%, 100% 0%, 0% 0%; }
    50%{ background-position:25% -4%, 90% 6%, 0% 4%; }
    100%{ background-position:15% -10%, 100% 0%, 0% 0%; }
  }
  @keyframes toastPop{
    0%{ opacity:0; transform:translate(-50%,12px) scale(.92); }
    60%{ opacity:1; transform:translate(-50%,-4px) scale(1.03); }
    100%{ opacity:1; transform:translate(-50%,0) scale(1); }
  }
  @keyframes shine{ 0%{ background-position:-120% 0; } 100%{ background-position:220% 0; } }

  body{
    margin:0; padding:18px 14px 40px;
    font-family:'Vazirmatn', sans-serif;
    color:var(--text);
    background:
      radial-gradient(1100px 500px at 15% -10%, #1a2540 0%, transparent 60%),
      radial-gradient(900px 500px at 100% 0%, #142235 0%, transparent 55%),
      linear-gradient(180deg, var(--bg1), var(--bg2));
    background-size:160% 160%, 160% 160%, 100% 100%;
    animation:bgShift 16s ease-in-out infinite;
    min-height:100vh;
    text-align:center;
  }

  .brand{ margin:6px 0 26px; }
  .brand .emoji{ font-size:34px; line-height:1; margin-bottom:6px; display:inline-block; animation:float 3.4s ease-in-out infinite; }
  h2{ font-weight:800; font-size:22px; margin:0 0 4px; letter-spacing:.2px; }
  .status{
    display:inline-flex; align-items:center; gap:6px;
    font-size:12.5px; color:var(--muted);
    background:rgba(255,255,255,0.03); border:1px solid var(--line);
    padding:5px 12px; border-radius:999px;
  }
  .status .dot{ width:7px; height:7px; border-radius:50%; background:#3ddc84; box-shadow:0 0 8px #3ddc84; animation:dotPulse 2s infinite; }

  #appContent > *{ opacity:0; animation:fadeInUp .55s ease forwards; }
  #appContent > *:nth-child(1){ animation-delay:.03s }
  #appContent > *:nth-child(2){ animation-delay:.07s }
  #appContent > *:nth-child(3){ animation-delay:.11s }
  #appContent > *:nth-child(4){ animation-delay:.15s }
  #appContent > *:nth-child(5){ animation-delay:.19s }
  #appContent > *:nth-child(6){ animation-delay:.23s }
  #appContent > *:nth-child(7){ animation-delay:.27s }
  #appContent > *:nth-child(8){ animation-delay:.31s }
  #appContent > *:nth-child(9){ animation-delay:.35s }
  #appContent > *:nth-child(10){ animation-delay:.39s }
  #appContent > *:nth-child(11){ animation-delay:.43s }
  #appContent > *:nth-child(12){ animation-delay:.47s }
  #appContent > *:nth-child(n+13){ animation-delay:.5s }

  .msg, .lbRow, #quizOptions button{ animation:fadeInUp .35s ease; }

  .card{
    background:linear-gradient(180deg, var(--card2), var(--card));
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:16px;
    text-align:right;
    box-shadow:0 10px 24px -14px rgba(0,0,0,0.6);
  }
  .section-title{
    display:flex; align-items:center; gap:8px;
    font-size:13px; font-weight:700; color:var(--muted);
    margin:26px 4px 12px; text-align:right;
  }
  .section-title .ico{ font-size:15px; }
  .section-title::after{
    content:""; flex:1; height:1px;
    background:linear-gradient(90deg, var(--line), transparent);
  }
  .card > .section-title{ margin-top:0; }

  .grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .grid3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }

  button{
    position:relative; overflow:hidden;
    padding:16px 8px; font-size:14.5px; font-weight:600; font-family:inherit;
    border:1px solid var(--line); border-radius:14px;
    background:var(--card2); color:var(--text);
    box-shadow:0 4px 10px -6px rgba(0,0,0,0.5);
    transition:transform .12s ease, background .15s ease, border-color .15s ease, box-shadow .15s ease;
  }
  button:hover{ transform:translateY(-2px); box-shadow:0 8px 16px -8px rgba(0,0,0,0.55); border-color:#33456b; }
  button:active{ background:var(--accent); border-color:var(--accent); transform:scale(0.96); box-shadow:0 2px 8px -3px rgba(59,130,246,.6); }
  button::after{
    content:""; position:absolute; inset:0;
    background:linear-gradient(100deg, transparent 30%, rgba(255,255,255,.10) 50%, transparent 70%);
    background-size:250% 100%; background-position:-120% 0; pointer-events:none;
  }
  button:active::after{ animation:shine .55s ease; }

  .toast{
    position:fixed; bottom:22px; left:50%; transform:translate(-50%,0);
    background:var(--accent); color:#fff; padding:10px 22px; border-radius:999px;
    font-size:13px; font-weight:600; opacity:0; pointer-events:none;
    box-shadow:0 8px 20px -6px rgba(59,130,246,.6);
  }
  .toast.show{ opacity:1; animation:toastPop .4s ease; }

  #lockScreen{
    position:fixed; inset:0;
    background:
      radial-gradient(900px 500px at 50% 0%, #1a2540 0%, transparent 60%),
      linear-gradient(180deg, var(--bg1), var(--bg2));
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; z-index:100; padding:20px;
  }
  #lockScreen .emoji{ font-size:40px; margin-bottom:4px; }
  #lockScreen input{
    padding:14px; font-size:16px; border-radius:12px; border:1px solid var(--line);
    width:240px; text-align:center; background:var(--card2); color:var(--text);
    font-family:inherit;
  }
  #lockScreen input:focus{ outline:none; border-color:var(--accent); }
  #lockScreen button{
    padding:14px 20px; font-size:15px; border:none; border-radius:12px;
    background:var(--accent); color:#fff; width:240px; font-weight:700;
  }
  #lockError{ color:var(--danger); font-size:13px; min-height:18px; }
  #appContent{ display:none; max-width:480px; margin:0 auto; }

  #chatBox{
    text-align:right; background:var(--card2); border:1px solid var(--line);
    border-radius:14px; padding:12px;
    min-height:120px; max-height:280px; overflow-y:auto; margin-bottom:10px;
  }
  .msg{ padding:9px 13px; border-radius:12px; margin:6px 0; font-size:14px; line-height:1.6; }
  .msg.user{ background:var(--accent); margin-left:26px; }
  .msg.ai{ background:var(--card); border:1px solid var(--line); margin-right:26px; }
  .chatRow{ display:flex; gap:8px; }
  #chatInput{
    flex:1; padding:14px; font-size:15px; border-radius:12px; border:1px solid var(--line);
    background:var(--card2); color:var(--text); font-family:inherit;
  }
  #chatInput:focus{ outline:none; border-color:var(--accent); }
  #micBtn, #sendBtn{ padding:14px 16px; border-radius:12px; border:none; background:var(--accent); color:#fff; }
  #micBtn.listening{ background:var(--danger); animation:pulse 1.1s infinite; }
  @keyframes pulse{ 0%,100%{ box-shadow:0 0 0 0 rgba(255,107,107,.55);} 50%{ box-shadow:0 0 0 8px rgba(255,107,107,0);} }

  #speakToggleRow{
    display:flex; align-items:center; gap:8px; justify-content:flex-end;
    font-size:13px; color:var(--muted); margin-bottom:10px;
  }
  #speakToggleRow input{ width:18px; height:18px; accent-color:var(--accent); }

  #volumeBox{ background:var(--card2); border:1px solid var(--line); border-radius:14px; padding:14px; text-align:right; }
  #volumeBox input[type=range]{ width:100%; margin:12px 0 4px; accent-color:var(--accent); }
  #volumeValue{ font-size:20px; font-weight:800; color:var(--accent); }

  #secretBox{ display:none; margin:16px 0; gap:8px; }
  #secretBox input{
    flex:1; padding:12px; font-size:14px; border-radius:10px; border:1px solid var(--line);
    background:var(--card2); color:var(--text); text-align:center; font-family:inherit;
  }
  #secretBox button{ padding:12px 16px; background:var(--accent); border:none; color:#fff; }
  #partyGrid button.active{ background:var(--accent2); border-color:var(--accent2); color:#1a1200; }

  #quizBox{
    display:none; text-align:right; background:var(--card2); border:1px solid var(--line);
    border-radius:14px; padding:14px; margin-top:10px;
  }
  #quizProgress{ font-size:12px; color:var(--muted); margin-bottom:8px; }
  #quizQuestion{ font-size:15px; margin-bottom:10px; line-height:1.7; font-weight:600; }
  #quizOptions{ display:flex; flex-direction:column; gap:8px; }
  #quizOptions button{ text-align:right; width:100%; }
  #leaderboardBox{
    display:none; text-align:right; background:var(--card2); border:1px solid var(--line);
    border-radius:14px; padding:14px; margin-top:10px; font-size:14px;
  }
  .lbRow{ padding:7px 0; border-bottom:1px solid var(--line); }
  .lbRow:last-child{ border-bottom:none; }

  .miniBox{
    background:var(--card2); border:1px solid var(--line); border-radius:14px;
    padding:14px; margin-top:10px; text-align:right; font-size:14px; line-height:1.7;
    font-weight:600; color:var(--muted);
  }
  .miniForm{ display:flex; flex-direction:column; gap:8px; margin-top:10px; }
  .miniForm input{
    padding:11px; font-size:14px; border-radius:10px; border:1px solid var(--line);
    background:var(--bg1); color:var(--text); text-align:right; font-family:inherit;
  }
  .miniForm button{ background:var(--accent); border:none; color:#fff; font-weight:700; }
</style>
</head>
<body>

<div id="lockScreen">
  <div class="emoji">🖥️</div>
  <h2>دستیار رومیزی</h2>
  <input type="password" id="passInput" placeholder="رمز عبور" autofocus>
  <button onclick="checkPass()">ورود</button>
  <div id="lockError"></div>
</div>

<div id="appContent">

<div class="brand">
  <div class="emoji">🖥️</div>
  <h2 id="titleTap" onclick="titleTap()">دستیار رومیزی</h2>
  <div class="status"><span class="dot"></span>کنترل از هرجا</div>
</div>

<div id="secretBox" class="chatRow">
  <input type="text" id="secretInput" placeholder="رمز مخفی رو وارد کن">
  <button onclick="checkSecret()">تایید</button>
</div>

<div class="card">
<div class="grid">
<button onclick="btn(1)">🌡️ دما</button>
<button onclick="btn(2)">🕒 ساعت</button>
<button onclick="btn(3)">☁️ آب‌وهوا</button>
<button onclick="btn(4)">📅 تاریخ شمسی</button>
<button onclick="btn(5)">📌 تعطیلی امروز</button>
<button onclick="btn(6)">📌 تعطیلی فردا</button>
<button onclick="btn(7)">💬 جمله ۱</button>
<button onclick="btn(8)">💬 جمله ۲</button>
</div>
</div>

<div class="section-title"><span class="ico">🎵</span>موزیک</div>
<div class="card">
<div class="grid">
<button onclick="btn(9)">▶️ پخش / توقف</button>
<button onclick="btn(10)">⏹️ توقف کامل</button>
<button onclick="btn(11)">⏭️ آهنگ بعدی</button>
<button onclick="btn(12)">⏮️ آهنگ قبلی</button>
</div>
</div>

<div class="section-title"><span class="ico">🔊</span>صدا</div>
<div id="volumeBox">
  <div>سطح صدا: <span id="volumeValue">50</span></div>
  <input type="range" id="volumeSlider" min="1" max="100" value="50"
         oninput="document.getElementById('volumeValue').innerText = this.value"
         onchange="setVolume(this.value)">
</div>

<div class="section-title"><span class="ico">✨</span>قابلیت‌های ویژه</div>
<div class="card">
<div class="grid">
<button onclick="btn(16)">📊 آمار من</button>
<button onclick="btn(17)">🔮 فال حافظ</button>
</div>
<div class="grid" id="partyGrid" style="margin-top:10px;">
<button id="partyOnBtn" onclick="setParty(true)">🎉 حالت مهمونی روشن</button>
<button id="partyOffBtn" onclick="setParty(false)">🌙 حالت مهمونی خاموش</button>
</div>
</div>

<div class="section-title"><span class="ico">🏆</span>مسابقه و امتیازات</div>
<div class="card">
<div class="grid">
<button onclick="startQuiz()">🎮 شروع مسابقه</button>
<button onclick="showLeaderboard()">🏆 جدول امتیازات</button>
</div>
<div id="quizBox">
  <div id="quizProgress"></div>
  <div id="quizQuestion"></div>
  <div id="quizOptions"></div>
</div>
<div id="leaderboardBox"></div>
</div>

<div class="section-title"><span class="ico">⏳</span>زمان و یادآوری</div>
<div class="miniBox" id="nowruzBox"></div>
<div class="miniBox" id="fortuneBox"></div>

<div class="miniBox">
  شمارش معکوس شخصی
  <div class="miniForm">
    <input type="text" id="pcLabel" placeholder="اسم مناسبت (مثلاً امتحان ریاضی)">
    <input type="date" id="pcDate">
    <button onclick="savePersonalCountdown()">ذخیره</button>
  </div>
  <div id="pcResult" style="margin-top:8px;"></div>
</div>

<div class="miniBox">
  تایمر / یادآور
  <div class="miniForm">
    <input type="number" id="timerMinutes" placeholder="چند دقیقه دیگه؟">
    <input type="text" id="timerLabel" placeholder="یادآوری چی؟">
    <button onclick="startTimer()">شروع تایمر</button>
  </div>
  <div id="timerStatus" style="margin-top:8px;"></div>
</div>

<div class="miniBox">
  پیام به آینده
  <div class="miniForm">
    <input type="text" id="fmText" placeholder="پیامت چیه؟">
    <input type="date" id="fmDate">
    <button onclick="saveFutureMsg()">ذخیره‌ی پیام</button>
  </div>
  <div id="fmStatus" style="margin-top:8px;"></div>
</div>

<div class="section-title"><span class="ico">🤖</span>دستیار هوشمند</div>
<div class="card">
<div id="speakToggleRow">
  <label for="speakToggle">جواب از بلندگوی دستگاه هم پخش بشه</label>
  <input type="checkbox" id="speakToggle" onchange="saveSpeakToggle()">
</div>
<div id="chatBox"></div>
<div class="chatRow">
  <button id="micBtn" onclick="toggleMic()">🎤</button>
  <input type="text" id="chatInput" placeholder="پیامت رو بنویس یا میکروفون بزن...">
  <button id="sendBtn" onclick="sendChat()">ارسال</button>
</div>
</div>

<div id="toast" class="toast">ارسال شد</div>
</div>

<script>
const PROXY_URL = "https://desk-assistant-proxy.kdkdke126.workers.dev";
const AI_URL = "https://desk-assistant-ai.kdkdke126.workers.dev";
const SITE_PASSWORD = "Mm17881788@";

function checkPass() {
  const val = document.getElementById("passInput").value;
  if (val === SITE_PASSWORD) {
    localStorage.setItem("deskAssistantUnlocked", "1");
    document.getElementById("lockScreen").style.display = "none";
    document.getElementById("appContent").style.display = "block";
  } else {
    document.getElementById("lockError").innerText = "رمز اشتباهه";
  }
}

document.getElementById("passInput").addEventListener("keydown", function(e) {
  if (e.key === "Enter") checkPass();
});

if (localStorage.getItem("deskAssistantUnlocked") === "1") {
  document.getElementById("lockScreen").style.display = "none";
  document.getElementById("appContent").style.display = "block";
}

function btn(id) {
  fetch(PROXY_URL + "/?id=" + id)
    .then(r => r.text()).then(t => { document.getElementById("toast").innerText = t; showToast(); });
}

function showToast() {
  const t = document.getElementById("toast");
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 1200);
}

function setVolume(level) {
  const lvl = Math.max(1, Math.min(100, parseInt(level)));
  btn(100 + lvl);
}

function setParty(on) {
  btn(on ? 23 : 24);
  document.getElementById("partyOnBtn").classList.toggle("active", on);
  document.getElementById("partyOffBtn").classList.toggle("active", !on);
}

const SECRET_CODES = {
  "konami": 30,
  "mohandes": 31
};
let tapCount = 0;
let tapTimer = null;

function titleTap() {
  tapCount++;
  clearTimeout(tapTimer);
  tapTimer = setTimeout(() => { tapCount = 0; }, 1500);
  if (tapCount >= 5) {
    tapCount = 0;
    const box = document.getElementById("secretBox");
    box.style.display = "flex";
    document.getElementById("secretInput").focus();
  }
}

function checkSecret() {
  const val = document.getElementById("secretInput").value.trim().toLowerCase();
  const id = SECRET_CODES[val] || 32;
  btn(id);
  document.getElementById("secretInput").value = "";
  document.getElementById("secretBox").style.display = "none";
}

document.getElementById("secretInput").addEventListener("keydown", function(e) {
  if (e.key === "Enter") checkSecret();
});

const LB_URL = "https://leaderboard-proxy.kdkdke126.workers.dev";
let quizQuestions = [];
let quizIndex = 0;
let quizScore = 0;

function decodeHTML(html) {
  const txt = document.createElement("textarea");
  txt.innerHTML = html;
  return txt.value;
}

async function startQuiz() {
  document.getElementById("leaderboardBox").style.display = "none";
  const box = document.getElementById("quizBox");
  box.style.display = "block";
  document.getElementById("quizProgress").innerText = "";
  document.getElementById("quizQuestion").innerText = "در حال دریافت سوال...";
  document.getElementById("quizOptions").innerHTML = "";

  const cat = Math.random() < 0.5 ? 11 : 15;
  try {
    const resp = await fetch(`https://opentdb.com/api.php?amount=5&category=${cat}&type=multiple`);
    const data = await resp.json();
    if (!data.results || !data.results.length) throw new Error("no questions");
    quizQuestions = data.results;
    quizIndex = 0;
    quizScore = 0;
    showQuizQuestion();
  } catch (e) {
    document.getElementById("quizQuestion").innerText = "اتصال به سوال‌ها برقرار نشد، دوباره امتحان کن";
  }
}

function showQuizQuestion() {
  if (quizIndex >= quizQuestions.length) {
    finishQuiz();
    return;
  }
  const q = quizQuestions[quizIndex];
  document.getElementById("quizProgress").innerText =
    `سوال ${quizIndex + 1} از ${quizQuestions.length} — امتیاز: ${quizScore}`;
  document.getElementById("quizQuestion").innerText = decodeHTML(q.question);

  const correct = decodeHTML(q.correct_answer);
  const options = [...q.incorrect_answers.map(decodeHTML), correct];
  options.sort(() => Math.random() - 0.5);

  const optBox = document.getElementById("quizOptions");
  optBox.innerHTML = "";
  options.forEach(opt => {
    const b = document.createElement("button");
    b.innerText = opt;
    b.onclick = () => answerQuiz(opt, correct);
    optBox.appendChild(b);
  });
}

function answerQuiz(picked, correct) {
  if (picked === correct) { quizScore++; btn(25); } else { btn(26); }
  quizIndex++;
  setTimeout(showQuizQuestion, 700);
}

async function finishQuiz() {
  document.getElementById("quizQuestion").innerText =
    `تموم شد! امتیازت: ${quizScore} از ${quizQuestions.length}`;
  document.getElementById("quizOptions").innerHTML = "";
  document.getElementById("quizProgress").innerText = "";

  const name = prompt("اسمت رو برای جدول امتیازات بنویس:");
  if (name && name.trim()) {
    try {
      await fetch(LB_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ feed: "leaderboard", value: name.trim() + "|" + quizScore })
      });
    } catch (e) {}
  }
}

async function showLeaderboard() {
  document.getElementById("quizBox").style.display = "none";
  const box = document.getElementById("leaderboardBox");
  box.style.display = "block";
  box.innerHTML = "در حال بارگذاری...";
  try {
    const resp = await fetch(`${LB_URL}?feed=leaderboard&limit=50`);
    const data = await resp.json();
    const rows = data.map(d => {
      const parts = (d.value || "").split("|");
      return { name: parts[0] || "؟", score: parseInt(parts[1]) || 0 };
    });
    rows.sort((a, b) => b.score - a.score);
    const top = rows.slice(0, 10);
    box.innerHTML = top.length
      ? top.map((r, i) => `<div class="lbRow">${i + 1}. ${r.name} — ${r.score} امتیاز</div>`).join("")
      : "هنوز امتیازی ثبت نشده";
  } catch (e) {
    box.innerHTML = "خطا در دریافت جدول امتیازات";
  }
}

function nowruzCountdown() {
  const now = new Date();
  let year = now.getFullYear();
  let target = new Date(year, 2, 21, 0, 0, 0);
  if (now >= target) target = new Date(year + 1, 2, 21, 0, 0, 0);
  const days = Math.ceil((target - now) / (1000 * 60 * 60 * 24));
  document.getElementById("nowruzBox").innerText = `🌱 ${days} روز تا نوروز مونده`;
}

const FORTUNES = [
  "امروز روز خوبیه برای شروع یه کار جدید.",
  "یه نفس عمیق بکش، همه‌چی درست می‌شه.",
  "امروز حواست به خودت هم باشه، نه فقط کارها.",
  "یه قدم کوچیک هم جلو رفتنه.",
  "امروز به یکی که دوستش داری پیام بده.",
  "استراحت کردن هم بخشی از پیشرفته.",
  "امروز یه چیز جدید یاد بگیر، هرچقدر کوچیک.",
  "به خودت سخت نگیر، داری خوب پیش می‌ری.",
  "امروز یکی از کارهای عقب‌افتاده رو تموم کن.",
  "یادت باشه آب بخوری امروز 😄",
  "امروز یه لبخند به یکی هدیه بده.",
  "کارهای بزرگ از کارهای کوچیک شروع می‌شن.",
  "امروز رو با انرژی مثبت شروع کن.",
  "یه‌کم به آینده‌ت فکر کن، ولی امروز رو زندگی کن.",
  "امروز حتماً یه استراحت کوتاه بین کارها بذار."
];
function dailyFortune() {
  const todayKey = new Date().toISOString().slice(0, 10);
  let idx = 0;
  for (let i = 0; i < todayKey.length; i++) idx += todayKey.charCodeAt(i);
  idx = idx % FORTUNES.length;
  document.getElementById("fortuneBox").innerText = "🔮 فال امروز: " + FORTUNES[idx];
}

function savePersonalCountdown() {
  const label = document.getElementById("pcLabel").value.trim();
  const date = document.getElementById("pcDate").value;
  if (!label || !date) return;
  localStorage.setItem("personalCountdown", JSON.stringify({ label, date }));
  document.getElementById("pcLabel").value = "";
  document.getElementById("pcDate").value = "";
  renderPersonalCountdown();
}
function renderPersonalCountdown() {
  const raw = localStorage.getItem("personalCountdown");
  const box = document.getElementById("pcResult");
  if (!raw) { box.innerText = ""; return; }
  const { label, date } = JSON.parse(raw);
  const target = new Date(date);
  const now = new Date();
  const diffDays = Math.ceil((target - now) / (1000 * 60 * 60 * 24));
  let mood;
  if (diffDays < 0) mood = "گذشت! 😅";
  else if (diffDays === 0) mood = "همین امروزه! 😱";
  else if (diffDays <= 3) mood = "وای وای وای، خیلی نزدیکه 😰";
  else if (diffDays <= 7) mood = "داره نزدیک می‌شه‌ها 😬";
  else if (diffDays <= 30) mood = "یه‌کم وقت داری، ولی غافل نشو 🙂";
  else mood = "خیالت راحت باشه، وقت زیاده 😌";
  box.innerText = `${label}: ${diffDays} روز مونده — ${mood}`;
}

let timerHandle = null;
function startTimer() {
  const mins = parseFloat(document.getElementById("timerMinutes").value);
  const label = document.getElementById("timerLabel").value.trim() || "یادآوری";
  if (!mins || mins <= 0) return;
  if (timerHandle) clearTimeout(timerHandle);
  document.getElementById("timerStatus").innerText =
    `⏳ تایمر «${label}» برای ${mins} دقیقه‌ی دیگه فعال شد (تا وقتی این صفحه بازه)`;
  timerHandle = setTimeout(() => {
    document.getElementById("timerStatus").innerText = `⏰ ${label}`;
    alert("⏰ " + label);
  }, mins * 60 * 1000);
}

async function saveFutureMsg() {
  const text = document.getElementById("fmText").value.trim();
  const date = document.getElementById("fmDate").value;
  const status = document.getElementById("fmStatus");
  if (!text || !date) return;
  status.innerText = "در حال ذخیره...";
  try {
    await fetch(LB_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ feed: "futuremsg", value: date + "|" + text })
    });
    document.getElementById("fmText").value = "";
    document.getElementById("fmDate").value = "";
    status.innerText = "ذخیره شد ✅ همون تاریخ که سایت رو باز کنی نشونت می‌دم.";
  } catch (e) {
    status.innerText = "خطا در ذخیره‌سازی";
  }
}

async function checkFutureMsg() {
  try {
    const resp = await fetch(`${LB_URL}?feed=futuremsg&limit=1`);
    const data = await resp.json();
    if (!data.length) return;
    const [dateStr, ...rest] = data[0].value.split("|");
    const text = rest.join("|");
    const target = new Date(dateStr);
    const now = new Date();
    const shownKey = "futuremsgShown_" + dateStr;
    if (now >= target && !localStorage.getItem(shownKey)) {
      localStorage.setItem(shownKey, "1");
      setTimeout(() => alert("💌 پیام از گذشته:\n\n" + text), 500);
    }
  } catch (e) {}
}

nowruzCountdown();
dailyFortune();
renderPersonalCountdown();
checkFutureMsg();

function saveSpeakToggle() {
  const on = document.getElementById("speakToggle").checked;
  localStorage.setItem("aiSpeakEnabled", on ? "1" : "0");
}
if (localStorage.getItem("aiSpeakEnabled") === "1") {
  document.getElementById("speakToggle").checked = true;
}

function addMsg(text, who) {
  const box = document.getElementById("chatBox");
  const div = document.createElement("div");
  div.className = "msg " + who;
  div.innerText = text;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

function sendChat() {
  const input = document.getElementById("chatInput");
  const text = input.value.trim();
  if (!text) return;
  addMsg(text, "user");
  input.value = "";
  addMsg("رکس در حال فکر کردنه...", "ai");

  const speakOn = document.getElementById("speakToggle").checked;

  const thinkingMsgs = ["رکس در حال فکر کردنه...", "چند لحظه صبر کن...", "هنوز رو جوابشم...", "داره جواب میاد، صبر کن..."];
  let thinkingIdx = 0;
  const thinkingInterval = setInterval(() => {
    thinkingIdx = (thinkingIdx + 1) % thinkingMsgs.length;
    const box = document.getElementById("chatBox");
    if (box.lastChild) box.lastChild.innerText = thinkingMsgs[thinkingIdx];
  }, 4000);

  const ctrl = new AbortController();
  const killer = setTimeout(() => ctrl.abort(), 40000);

  fetch(AI_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ text: text, speak: speakOn }),
    signal: ctrl.signal
  })
  .then(r => r.json())
  .then(data => {
    clearTimeout(killer); clearInterval(thinkingInterval);
    const box = document.getElementById("chatBox");
    box.removeChild(box.lastChild);
    addMsg(data.answer || "جوابی نیومد", "ai");
  })
  .catch(() => {
    clearTimeout(killer); clearInterval(thinkingInterval);
    const box = document.getElementById("chatBox");
    box.removeChild(box.lastChild);
    addMsg("اتصال با هوش مصنوعی برقرار نشد، دوباره امتحان کن", "ai");
  });
}

document.getElementById("chatInput").addEventListener("keydown", function(e) {
  if (e.key === "Enter") sendChat();
});

let recognition = null;
let isListening = false;

function initRecognition() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) return null;
  const r = new SpeechRecognition();
  r.lang = "fa-IR";
  r.continuous = false;
  r.interimResults = false;
  r.maxAlternatives = 1;
  return r;
}

function toggleMic() {
  if (isListening) {
    if (recognition) recognition.stop();
    return;
  }

  if (!recognition) recognition = initRecognition();
  if (!recognition) {
    alert("متاسفانه مرورگرت از تشخیص صدا پشتیبانی نمی‌کنه");
    return;
  }

  isListening = true;
  document.getElementById("micBtn").classList.add("listening");

  recognition.onresult = function(event) {
    const transcript = event.results[0][0].transcript;
    document.getElementById("chatInput").value = transcript;
    sendChat();
  };

  recognition.onerror = function(event) {
    console.error("خطای تشخیص صدا:", event.error);
    isListening = false;
    document.getElementById("micBtn").classList.remove("listening");
  };

  recognition.onend = function() {
    isListening = false;
    document.getElementById("micBtn").classList.remove("listening");
  };

  try {
    recognition.start();
  } catch (e) {
    isListening = false;
    document.getElementById("micBtn").classList.remove("listening");
  }
}
